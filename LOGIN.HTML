<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./LOGIN.css">
</head>
<body>

<body>

    <!-- Top Navigation Back Link -->
    <div class="top-nav">
        <a href="index.html" class="back-home-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            <span>Back to Home</span>
        </a>
    </div>

    <div class="signup-container">
        <!-- Logo Header -->
        <div class="brand-header">
            <div class="logo-box">
                <img src="./image/logo.jpg" alt="HireBath Logo" class="logo-img">
            </div>
            <h2>Create Your Account</h2>
            <p>Start your smart career journey today and discover matching opportunities.</p>
        </div>

        <!-- Signup Card -->
        <div class="signup-card">
            <form>
                <!-- Account Type (Student Only) -->
                <div class="form-group">
                    <label>Account Type</label>
                    <div class="account-type-selector">
                        <div class="type-btn active">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                            <span>Student / Graduate</span>
                        </div>
                    </div>
                </div>

                <!-- Full Name -->
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>

             

                <!-- Terms and Conditions -->
                <div class="terms-group">
                    <label class="checkbox-label">
                        <input type="checkbox" required>
                        <span>I agree to the <a href="#">Terms of Use</a> & <a href="#">Privacy Policy</a></span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">
                    <span>Create Account</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 5"/></svg>
                </button>
            </form>
        </div>
    </div>

</body>
</html>
</body>
